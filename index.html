<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>違和感を探せ。</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <p class="subtitle">FIND THE DIFFERENCE</p>
        <h1>違和感を探せ。</h1>
        <p class="description">
            その文字、本当にカタカナですか？
        </p>

        <div class="status">
            <p>STAGE <span id="stage">1</span></p>
            <p>SCORE <span id="score">0</span></p>
        </div>

        <h2 id="stage-title">形の違いに気づく</h2>
        <p id="instruction" class="instruction">
            「エ」の中から「工」を探せ。
        </p>


        <div class="timer-area">
            <p>TIME LIMIT</p>
            <div class="timer-track">
                <div id="timer-bar"></div>
            </div>
            <p id="timer">30</p>
        </div>

        <p id="answer-display" class="answer-display"></p>


        <div id="game-board" class="game-board"></div>

        <p id="message" class="message" aria-live="polite">
            違う文字をクリックしよう。
        </p>

        <button id="restart-button" type="button">
            はじめから
        </button>
    </main>

    <script src="script.js"></script>
</body>

</html>
